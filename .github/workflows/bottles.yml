name: Build and publish bottles

on:
  workflow_dispatch:
    inputs:
      formulae:
        description: Formula names or cask:name separated by commas, or all for every target
        required: false
        default: all
        type: string
  workflow_call:
    inputs:
      brew_commit:
        required: true
        type: string
      core_commit:
        required: true
        type: string
    secrets:
      CORE_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: bottles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    name: Select formulae
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      formulae: ${{ steps.select.outputs.formulae }}
      has_work: ${{ steps.select.outputs.has_work }}
      brew_commit: ${{ steps.snapshot.outputs.brew_commit }}
      core_commit: ${{ steps.snapshot.outputs.core_commit }}
    env:
      BOTTLE_CONFIG: ${{ vars.BOTTLE_CONFIG }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Select build commits
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BREW_COMMIT: ${{ inputs.brew_commit }}
          REQUESTED_CORE_COMMIT: ${{ inputs.core_commit }}
        run: python3 -m bottles.resolve --build
      - name: Select requested Core formulae
        id: select
        env:
          REQUESTED_FORMULAE: ${{ inputs.formulae || 'all' }}
        run: python3 -u -m bottles.schedule

  pipeline:
    needs: select
    if: needs.select.outputs.has_work == 'true'
    uses: ./.github/workflows/waves.yml
    with:
      formulae: ${{ needs.select.outputs.formulae }}
      brew_commit: ${{ needs.select.outputs.brew_commit }}
      core_commit: ${{ needs.select.outputs.core_commit }}
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
    secrets:
      CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
